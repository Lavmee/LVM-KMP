# cargo deny check: the licenses, sources and duplicate crates of lvm-tui's dependencies.

[graph]
all-features = true

[licenses]
# Permissive licenses that fit an Apache-2.0 binary. MPL-2.0 is file-level copyleft: unmodified, it only needs its notice.
# CDLA-Permissive-2.0 covers the root certificates that webpki-roots bundles for HTTPS to Maven Central.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
