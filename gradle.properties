GROUP=tech.annexflow.lvm
VERSION_NAME=0.5.0

# The artifact IDs and the POM of every published module, of this build and of blueprint.
lvm.publish.artifactIdPrefix=lvm-
lvm.publish.description=Kotlin Multiplatform libraries and Gradle convention plugins for Android, iOS and desktop apps
lvm.publish.url=https://github.com/Lavmee/LVM-KMP
lvm.publish.license.name=The Apache License, Version 2.0
lvm.publish.license.url=https://www.apache.org/licenses/LICENSE-2.0.txt
lvm.publish.developer.id=Lavmee
lvm.publish.developer.name=Samuel Gagarin
lvm.publish.developer.url=https://github.com/Lavmee

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.daemon.jvmargs=-Xmx2g
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
