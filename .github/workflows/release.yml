name: Release

# A v* tag publishes both builds to Maven Central, which can't be undone, then creates the GitHub Release with the lvm
# command for each platform and publishes the lvm-tui crate to crates.io. RELEASING.md describes the steps.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# One release at a time, and never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  libraries:
    # macOS: the iOS klibs are built there.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check the version
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match VERSION_NAME=$version in gradle.properties."
            exit 1
          fi
          case "$version" in
            *-SNAPSHOT)
              echo "::error::$version is a snapshot version; Maven Central takes only release versions."
              exit 1
              ;;
          esac

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Publishing doesn't check the ABI dumps; the tests ran in CI on the tagged commit.
      - name: Check the ABI dumps
        run: ./gradlew checkKotlinAbi

      # Blueprint publishes in its own job once the libraries are out, too late to stop the release.
      - name: Check the blueprint ABI dumps
        run: ./gradlew -p blueprint checkKotlinAbi

      - name: Publish the libraries
        run: ./gradlew publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  blueprint:
    # Blueprint is an included build, which the root publishing task doesn't reach. It goes after the libraries: the
    # settings plugin imports lvm-versions of its own version. If this job fails, re-run it alone; the libraries are out.
    needs: libraries
    # Blueprint has only JVM code.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish the blueprint plugins
        run: ./gradlew -p blueprint publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  tui:
    # The lvm command for each platform, built from the lvm-tui crate. The binaries wait for the GitHub Release, which
    # comes once both builds are out.
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # The oldest Ubuntu images, so the binaries run with older versions of glibc too.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Check the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' tui/Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match version $version in tui/Cargo.toml."
            exit 1
          fi

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable

      - name: Build
        run: cargo build --manifest-path tui/Cargo.toml --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          name="lvm-tui-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp LICENSE "dist/$name/"
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          cp "tui/target/${{ matrix.target }}/release/lvm$exe" "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            archive="$name.zip"
            7z a -tzip "$archive" "$name" > /dev/null
          else
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$archive"; else shasum -a 256 "$archive"; fi > "$archive.sha256"
          rm -r "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: lvm-tui-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    # After both builds are on Maven Central, so the release never announces a version that can't be resolved.
    needs: [libraries, blueprint, tui]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lvm-tui-*
          path: dist
          merge-multiple: true

      - name: Create the release
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "LVM ${GITHUB_REF_NAME#v}"
          --generate-notes
          --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  crates:
    # After both builds are on Maven Central, since lvm new starts builds on the LVM release of the crate's version.
    needs: [libraries, blueprint, tui]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # embed-files.sh copies what the crate embeds from outside tui/; --allow-dirty takes those untracked copies.
      - name: Publish lvm-tui to crates.io
        run: ./embed-files.sh && cargo publish --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
