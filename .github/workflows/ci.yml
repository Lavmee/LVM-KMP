name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
      - '.agents/**'
      - '.claude'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
      - '.agents/**'
      - '.claude'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two jobs run side by side: together they take longer than one job's timeout when blueprint changes and its fixture builds can't come from the build cache.
jobs:
  blueprint:
    # macOS, like the build job: the fixture builds configure iOS targets.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The fixture builds of all blueprint modules resolve dependencies into one TestKit Gradle home, which
      # setup-gradle doesn't cache.
      - uses: actions/cache@v6
        with:
          path: |
            blueprint/build/fixture-test-kit/caches/modules-2
            !blueprint/build/fixture-test-kit/caches/modules-2/*.lock
            !blueprint/build/fixture-test-kit/caches/modules-2/gc.properties
          key: testkit-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'blueprint/**/*.gradle.kts') }}
          restore-keys: testkit-${{ runner.os }}-

      - name: Read the Kotlin version
        id: kotlin
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      # The build job saves the Kotlin/Native toolchain. Two jobs saving the same key at once would warn.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}

      - name: Blueprint tests
        run: ./gradlew -p blueprint check

  build:
    # macOS: iOS klibs, frameworks and simulator tests need Xcode. The image also ships the Android SDK.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Read the Kotlin version
        id: kotlin
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      # The Kotlin/Native toolchain and its dependencies. No restore keys: a new Kotlin version needs a new toolchain anyway.
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}

      - name: Build and test all targets
        run: ./gradlew build
