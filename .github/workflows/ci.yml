name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS: iOS klibs, frameworks and simulator tests need Xcode. The image also ships the Android SDK.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Blueprint tests
        run: ./gradlew -p blueprint check

      - name: Build and test all targets
        run: ./gradlew build
