[versions]
agp = "9.4.1"
kotlin = "2.4.20"
detekt = "1.23.8"
detektComposeRules = "1.4.0"
junit = "5.13.4"
kotlinxCoroutines = "1.11.0"
turbine = "1.2.1"
kermit = "2.2.0"
kotlinxDatetime = "0.8.0"
kotlinxIo = "0.9.1"
androidxDataStore = "1.3.0"
kotlinxSerialization = "1.12.0"
okio = "3.18.2"
decompose = "3.6.2"
essenty = "2.7.1"
androidxActivity = "1.13.0"
androidxPaging = "3.5.3"
mokoPermissions = "0.20.1"
composeMultiplatform = "1.12.2"
navigationevent = "1.1.0"
composeUnstyled = "2.10.2"
ktor = "3.6.1"
kotlinRetry = "2.0.2"
kotlinCompileTesting = "0.14.0"
vanniktech = "0.37.0"

[libraries]
android-gradlePluginApi = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compilerEmbeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
